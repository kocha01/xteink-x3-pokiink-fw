[platformio]
default_envs = default
extra_configs = platformio.local.ini

[crosspoint]
; PokiInk X3 version trajectory.  Bumped from upstream 2.2.5 → 2.3.0 to
; mark the first PokiInk fork release that:
;   - Disables text AA on X3 (single partial refresh per page)
;   - Fixes carousel center-cover disappearance under heap pressure
;   - Relocates Recent-page "Remove" hint to match X3's top power button
;   - Switches OTA feed to kocha01/xteink-x3-pokiink-fw and adds
;     POKIINK_X3_FW_MAGIC board-tag verification
; Future bumps: patch (2.3.x) for fixes, minor (2.x.0) for features, major
; only on incompatible storage/OTA format changes.
version = 2.3.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
# Note: deliberately NOT setting board_upload.offset_address. Without it, PlatformIO
# follows the arduino-esp32 default and flashes bootloader + partitions + boot_app0
# (the otadata marker that pins boot to app0) + firmware atomically on every upload.
# Setting offset_address = 0x10000 would write only firmware.bin to app0, leaving
# stale otadata pointing at app1 (e.g. after an in-app OTA), which forces the user
# to flash twice for the new firmware to actually run.

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/git_branch.py
  post:scripts/build_recovery_image.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  bitbank2/JPEGDEC @ ^1.8.0
  links2004/WebSockets @ 2.7.3
  h2zero/NimBLE-Arduino @ ^1.4.0

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds

; PokiInk X3 development build — same X3 wiring + magic marker + OTA URL as
; pokiink_release, just with LOG_LEVEL=2 (debug) instead of LOG_LEVEL=1
; (info) so Serial Monitor shows the full trace.  Produces the SAME version
; label `<base>-pokiink-x3` as the production CI build so the About screen
; doesn't show a scary "preview" word on daily-driver flashes, and so the
; OTA semver compare doesn't end up upgrading from a dev label to a release
; label of the same numeric version.
[env:x3_preview]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-pokiink-x3\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DCROSSPOINT_BOARD_X3
  -DCROSSPOINT_KEYBOARD_STUB
  -DCROSSPOINT_SD_CS=12
  -DCROSSPOINT_SD_SPI_FQ=40000000UL
  -DCROSSPOINT_SD_HAS_POWER_SWITCH=1
  -DCROSSPOINT_SD_POWER_CONTROL_PIN=13
  -DCROSSPOINT_SD_POWER_ON_LEVEL=1
  -DCROSSPOINT_SD_POWER_SETTLE_MS=20
build_src_filter =
  +<*>
  -<bringup/x3_bringup_main.cpp>
  -<activities/util/KeyboardEntryActivity.cpp>
  -<nextgen_main.cpp>

[env:x3_bringup]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-x3-bringup\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DCROSSPOINT_BOARD_X3
  -DCROSSPOINT_SD_CS=12
  -DCROSSPOINT_SD_SPI_FQ=40000000UL
  -DCROSSPOINT_SD_HAS_POWER_SWITCH=1
  -DCROSSPOINT_SD_POWER_CONTROL_PIN=13
  -DCROSSPOINT_SD_POWER_ON_LEVEL=1
  -DCROSSPOINT_SD_POWER_SETTLE_MS=20
build_src_filter =
  -<*>
  +<bringup/x3_bringup_main.cpp>

[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

; PokiInk X3 production release.  Used by .github/workflows/release.yml when
; the user pushes a semver tag (e.g. "2.2.5").  Must include CROSSPOINT_BOARD_X3
; + the X3-specific SD wiring flags so the resulting binary is for X3
; hardware, NOT the upstream X4 layout that gh_release alone produces.
; The "-pokiink-x3" version suffix ends up in CROSSPOINT_VERSION (visible in
; Settings → System) but doesn't break the semver sscanf comparator in
; OtaUpdater::isUpdateNewer().
[env:pokiink_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-pokiink-x3\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1
  -DCROSSPOINT_BOARD_X3
  -DCROSSPOINT_KEYBOARD_STUB
  -DCROSSPOINT_SD_CS=12
  -DCROSSPOINT_SD_SPI_FQ=40000000UL
  -DCROSSPOINT_SD_HAS_POWER_SWITCH=1
  -DCROSSPOINT_SD_POWER_CONTROL_PIN=13
  -DCROSSPOINT_SD_POWER_ON_LEVEL=1
  -DCROSSPOINT_SD_POWER_SETTLE_MS=20
build_src_filter =
  +<*>
  -<bringup/x3_bringup_main.cpp>
  -<activities/util/KeyboardEntryActivity.cpp>
  -<nextgen_main.cpp>

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds  

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG

[env:nextgen]
extends = base
build_src_filter = 
    -<*> 
    +<nextgen_main.cpp>
build_unflags =
    -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort
build_flags =
    ${base.build_flags}
    -DLOG_LEVEL=2

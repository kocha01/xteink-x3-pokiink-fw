name: PokiInk X3 Release

# Triggers on any semver-shaped tag push (e.g. "2.2.5", "2.3.0", "v2.2.5").
# The OtaUpdater on-device fetches /releases/latest from this repo and
# compares the tag_name against the running build's CROSSPOINT_VERSION
# using semver sscanf — so the tag must parse as "%d.%d.%d" (optionally
# with a leading "v").
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-pokiink-x3-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build PokiInk X3 firmware
        # IMPORTANT: must be pokiink_release (not gh_release) — gh_release
        # builds without CROSSPOINT_BOARD_X3 and produces an X4-pinout binary
        # that bricks X3 devices.  pokiink_release includes the X3 board
        # flag, X3 SD wiring, and the POKIINK_X3_FW_MAGIC marker the OTA
        # board-tag check requires.
        run: pio run -e pokiink_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokiInk-X3-${{ github.ref_name }}
          path: |
            .pio/build/pokiink_release/bootloader.bin
            .pio/build/pokiink_release/firmware.bin
            .pio/build/pokiink_release/firmware.elf
            .pio/build/pokiink_release/firmware.map
            .pio/build/pokiink_release/partitions.bin
            .pio/build/pokiink_release/recovery.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # firmware.bin = OTA update payload (what installUpdate streams via
          #                esp_https_ota — its asset name must stay exactly
          #                "firmware.bin" because OtaUpdater::checkForUpdate
          #                does a literal `==` against assets[i]["name"]).
          # recovery.bin = full-flash image generated by build_recovery_image.py
          #                (bootloader + partitions + otadata + firmware), used
          #                for first-time flash via esptool when the device is
          #                a fresh board or has been bricked.
          files: |
            .pio/build/pokiink_release/firmware.bin
            .pio/build/pokiink_release/recovery.bin
          name: PokiInk X3 ${{ github.ref_name }}
          body: |
            PokiInk X3 Halo firmware **${{ github.ref_name }}**.

            ## Files

            - `firmware.bin` — OTA update. Push to the device via Settings → System Update,
              or upload via the web file manager.
            - `recovery.bin` — Full-flash image for fresh boards / unbricking. Flash with
              `esptool.py write_flash 0x0 recovery.bin`.

            ## Compatibility

            **PokiInk-X3 only.** Do not flash on Xteink X4 or upstream CrossPoint Halo 2
            hardware — the GPIO pinout differs and the device will not boot.
            The on-device OTA refuses to commit a binary missing the
            `POKIINK-X3-FW-MAGIC-MARKER` sentinel, so accidentally pointing
            this firmware at another board via Settings won't brick it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
